<!DOCTYPE html><html><head><title>Shape Summoner</title><style>body{margin:0;overflow:hidden;background:#111;}canvas{display:block;}</style></head><body><canvas id="game"></canvas><script>
const c=document.getElementById("game"),x=c.getContext("2d");function rs(){c.width=innerWidth;c.height=innerHeight;}rs();onresize=rs;
const p={x:c.width/2,y:c.height/2,r:20,s:5,col:"white",hp:100,maxHp:100,regen:0.1,mana:50,maxMana:50,mRegen:0.2,lvl:1,xp:0,xpNext:20,dmg:1,sCost:5,shCost:3,spdBoost:0,multi:false,multiCount:2};
let boss=null,shots=[],bShots=[],sums=[],keys={},shape=1,lastX=p.x,lastY=p.y,dead=false,choose=false,cards=[];
const up=[
{name:"Max HP + Heal",apply(){p.maxHp+=20;p.hp=p.maxHp}},
{name:"Max Mana + Restore",apply(){p.maxMana+=20;p.mana=p.maxMana}},
{name:"Shot Damage Up",apply(){p.dmg+=1}},
{name:"Regen Boost",apply(){p.regen+=0.05;p.mRegen+=0.1}},
{name:"Move Speed Up",apply(){p.s+=0.5}},
{name:"Summon HP Up",apply(){sums.forEach(s=>s.hp+=10)}},
{name:"Summon Radius Up",apply(){sums.forEach(s=>s.r+=5)}},
{name:"Mana Efficiency",apply(){p.sCost=Math.max(1,p.sCost-1);p.shCost=Math.max(1,p.shCost-1)}},
{name:"Projectile Speed Up",apply(){p.spdBoost+=1}},
{name:"Multi-Shot +1",apply(){p.multi=true;p.multiCount+=1}}
];
onmousemove=e=>{lastX=e.clientX;lastY=e.clientY};
function spBoss(){let E=Math.random()<0.3;boss={x:Math.random()*c.width,y:Math.random()*c.height,r:E?60:50,hp:E?25:10,s:E?2.5:2,col:E?"purple":"red",elite:E,cd:0};}
setInterval(()=>{if(!boss&&!dead&&!choose)spBoss();},6000);
onkeydown=e=>{keys[e.key]=true;if(choose)return;if(e.key=="1")shape=1;if(e.key=="2")shape=2;if(e.key=="3")shape=3;if(e.key=="4")shape=4;if(e.key==" ")shoot();};
onkeyup=e=>keys[e.key]=false;
function offer(){choose=true;cards=[];while(cards.length<3){let r=up[Math.floor(Math.random()*up.length)];if(!cards.includes(r))cards.push(r);}}
onclick=e=>{
 if(choose){
  let w=250,h=150,g=50,sx=c.width/2-(w*1.5+g),y=250;
  for(let i=0;i<3;i++){let x0=sx+i*(w+g);if(e.clientX>=x0&&e.clientX<=x0+w&&e.clientY>=y&&e.clientY<=y+h){cards[i].apply();choose=false;return;}}
  return;
 }
 if(dead){respawn();return;}
 if(p.mana<p.sCost)return;p.mana-=p.sCost;
 sums.push({x:e.clientX,y:e.clientY,r:20,col:`hsl(${Math.random()*360},80%,60%)`,sh:shape,hp:10});
 fuse();
};
function shoot(){
 if(dead||choose)return;if(p.mana<p.shCost)return;p.mana-=p.shCost;
 let sp=8+p.spdBoost,a=Math.atan2(lastY-p.y,lastX-p.x);
 function mk(ang){shots.push({x:p.x,y:p.y,r:12,sp:sp,dx:Math.cos(ang),dy:Math.sin(ang),col:`hsl(${Math.random()*360},80%,60%)`,sh:shape,dmg:p.dmg});}
 if(p.multi){
  let n=p.multiCount,spread=0.25;
  for(let i=0;i<n;i++){let off=spread*((i/(n-1))-0.5);mk(a+off);}
 } else mk(a);
}
function respawn(){p.x=c.width/2;p.y=c.height/2;p.hp=p.maxHp;p.mana=p.maxMana;dead=false;boss=null;shots=[];bShots=[];sums=[];}
function drawS(s){
 x.fillStyle=s.col;
 if(s.sh==1){x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill();}
 if(s.sh==2)x.fillRect(s.x-s.r,s.y-s.r,s.r*2,s.r*2);
 if(s.sh==3){x.beginPath();x.moveTo(s.x,s.y-s.r);x.lineTo(s.x-s.r,s.y+s.r);x.lineTo(s.x+s.r,s.y+s.r);x.closePath();x.fill();}
 if(s.sh==4){
  let sp=5,outer=s.r,inner=s.r/2.5,rot=Math.PI/2*3,st=Math.PI/sp;
  x.beginPath();x.moveTo(s.x,s.y-outer);
  for(let i=0;i<sp;i++){x.lineTo(s.x+Math.cos(rot)*outer,s.y+Math.sin(rot)*outer);rot+=st;x.lineTo(s.x+Math.cos(rot)*inner,s.y+Math.sin(rot)*inner);rot+=st;}
  x.closePath();x.fill();
 }
}
function fuse(){
 for(let i=0;i<sums.length;i++){
  for(let j=i+1;j<sums.length;j++){
   let a=sums[i],b=sums[j],d=Math.hypot(a.x-b.x,a.y-b.y);
   if(d<a.r+b.r){a.r+=b.r*0.5;a.hp+=b.hp;sums.splice(j,1);j--;}
  }
 }
}
function lvlUp(){p.lvl++;p.xp=0;p.xpNext=Math.floor(p.xpNext*1.5);p.maxHp+=10;p.hp=p.maxHp;p.maxMana+=10;p.mana=p.maxMana;p.dmg+=0.5;p.regen+=0.02;}
function upd(){
 if(!dead&&!choose){
  if(keys["w"]||keys["W"])p.y-=p.s;
  if(keys["s"]||keys["S"])p.y+=p.s;
  if(keys["a"]||keys["A"])p.x-=p.s;
  if(keys["d"]||keys["D"])p.x+=p.s;
  p.hp=Math.min(p.maxHp,p.hp+p.regen);
  p.mana=Math.min(p.maxMana,p.mana+p.mRegen);
 }
 if(boss&&!dead&&!choose){
  let a=Math.atan2(p.y-boss.y,p.x-boss.x);
  for(let i=0;i<sums.length;i++){
   if(!boss)break;
   let s=sums[i],d=Math.hypot(boss.x-s.x,boss.y-s.y);
   if(d<boss.r+s.r){s.hp-=0.2;if(s.hp<=0){sums.splice(i,1);i--;}a+=Math.PI/2;}
  }
  if(boss){boss.x+=Math.cos(a)*boss.s;boss.y+=Math.sin(a)*boss.s;}
  boss.cd--;if(boss.cd<=0){
   let ba=Math.atan2(p.y-boss.y,p.x-boss.x);
   bShots.push({x:boss.x,y:boss.y,r:8,sp:5,dx:Math.cos(ba),dy:Math.sin(ba),col:boss.elite?"magenta":"orange",dmg:boss.elite?4:2});
   boss.cd=boss.elite?40:60;
  }
 }
 shots.forEach(s=>{s.x+=s.dx*s.sp;s.y+=s.dy*s.sp;});
 bShots.forEach(b=>{b.x+=b.dx*b.sp;b.y+=b.dy*b.sp;});
 if(boss){
  for(let i=shots.length-1;i>=0;i--){
   if(!boss)break;
   let s=shots[i],d=Math.hypot(s.x-boss.x,s.y-boss.y);
   if(d<s.r+boss.r){
    boss.hp-=s.dmg;shots.splice(i,1);
    if(boss.hp<=0){
     let E=boss.elite;boss=null;
     p.xp+=E?15:10;if(p.xp>=p.xpNext)lvlUp();
     if(E)offer();
     break;
    }
   }
  }
 }
 for(let i=bShots.length-1;i>=0;i--){
  let b=bShots[i],dp=Math.hypot(b.x-p.x,b.y-p.y);
  if(dp<b.r+p.r){
   p.hp-=b.dmg;bShots.splice(i,1);
   if(p.hp<=0){p.hp=0;dead=true;}
   continue;
  }
  let hit=false;
  for(let j=0;j<sums.length;j++){
   let s=sums[j],ds=Math.hypot(b.x-s.x,b.y-s.y);
   if(ds<b.r+s.r){
    s.hp-=b.dmg;bShots.splice(i,1);hit=true;
    if(s.hp<=0)sums.splice(j,1);
    break;
   }
  }
  if(hit)continue;
  if(b.x<-50||b.x>c.width+50||b.y<-50||b.y>c.height+50)bShots.splice(i,1);
 }
 if(boss&&!dead&&!choose){
  let d=Math.hypot(p.x-boss.x,p.y-boss.y);
  if(d<p.r+boss.r){
   p.hp-=1;if(p.hp<=0){p.hp=0;dead=true;}
  }
 }
}
function dr(){
 x.clearRect(0,0,c.width,c.height);
 x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fillStyle=p.col;x.fill();
 x.fillStyle="red";x.fillRect(p.x-20,p.y-p.r-20,40,6);
 x.fillStyle="lime";x.fillRect(p.x-20,p.y-p.r-20,(p.hp/p.maxHp)*40,6);
 x.fillStyle="blue";x.fillRect(p.x-20,p.y+p.r+10,40,6);
 x.fillStyle="cyan";x.fillRect(p.x-20,p.y+p.r+10,(p.mana/p.maxMana)*40,6);
 x.fillStyle="white";x.font="16px Arial";x.fillText(`Lvl ${p.lvl} XP ${p.xp}/${p.xpNext}`,10,20);
 sums.forEach(drawS);shots.forEach(drawS);
 bShots.forEach(b=>{x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fillStyle=b.col;x.fill();});
 if(boss){
  x.beginPath();x.arc(boss.x,boss.y,boss.r,0,Math.PI*2);x.fillStyle=boss.col;x.fill();
  x.fillStyle="white";x.fillRect(boss.x-40,boss.y-boss.r-20,80,10);
  x.fillStyle="lime";x.fillRect(boss.x-40,boss.y-boss.r-20,(boss.hp/(boss.elite?25:10))*80,10);
  if(boss.elite){x.fillStyle="yellow";x.font="14px Arial";x.fillText("ELITE",boss.x,boss.y-boss.r-35);}
 }
 if(choose){
  x.fillStyle="rgba(0,0,0,0.7)";x.fillRect(0,0,c.width,c.height);
  x.fillStyle="white";x.font="40px Arial";x.fillText("Choose an Upgrade",c.width/2,150);
  let w=250,h=150,g=50,sx=c.width/2-(w*1.5+g),y=250;
  cards.forEach((card,i)=>{
   let xx=sx+i*(w+g);
   x.fillStyle="#222";x.fillRect(xx,y,w,h);
   x.strokeStyle="white";x.strokeRect(xx,y,w,h);
   x.fillStyle="white";x.font="24px Arial";x.fillText(card.name,xx+w/2,y+h/2);
  });
 }
 if(dead&&!choose){
  x.fillStyle="rgba(0,0,0,0.7)";x.fillRect(0,0,c.width,c.height);
  x.fillStyle="white";x.font="60px Arial";x.fillText("YOU DIED",c.width/2,c.height/2-40);
  x.font="30px Arial";x.fillText("Click to Respawn",c.width/2,c.height/2+20);
 }
 requestAnimationFrame(loop);
}
function loop(){upd();dr();}
loop();
 <script src="upgradeWheel.js"></script>
</script>
</body>
</html>
